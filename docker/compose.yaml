# Ambiente local exclusivo para as atividades didaticas do PBL.
name: pbl-estudante
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: aluno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo docker/.env}
      POSTGRES_DB: laboratorio
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pbl_pg18_dados:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aluno -d laboratorio']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  pbl_pg18_dados:
